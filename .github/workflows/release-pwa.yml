name: Release Harness Lab Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0 or v0.1.0'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            command: package:desktop:win
          - platform: linux
            runner: ubuntu-latest
            command: package:desktop:linux
          - platform: macos
            runner: macos-latest
            command: package:desktop:mac
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate Harness
        run: npm test

      - name: Package desktop application
        run: npm run ${{ matrix.command }}

      - name: Package installable PWA
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\package-pwa.ps1 -Version '${{ inputs.version || github.ref_name }}' -OutputDirectory release

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: harness-desktop-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
          if-no-files-found: error

      - name: Upload PWA package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: harness-pwa
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: harness-desktop-*
          path: artifacts
          merge-multiple: true

      - name: Download PWA package
        uses: actions/download-artifact@v4
        with:
          name: harness-pwa
          path: artifacts

      - name: Determine release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_VERSION"
            [[ "$tag" == v* ]] || tag="v$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release with all packages
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing its assets"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "Harness Lab $RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
